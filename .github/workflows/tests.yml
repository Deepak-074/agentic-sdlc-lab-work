name: Tests

on:
  push:
    branches: [main, lab-start, "start/**"]
  pull_request:

jobs:
  unit-test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      AUTH_JWT_SECRET_KEY: test-secret-key-for-ci
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -e '.[dev]'
      - run: python -m pytest tests/unit -q

  integration-test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      AUTH_JWT_SECRET_KEY: test-secret-key-for-ci
      TEST_DATABASE_URL: sqlite:///./ci_test.db
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -e '.[dev]'
      - run: python -m pytest tests/integration -q
